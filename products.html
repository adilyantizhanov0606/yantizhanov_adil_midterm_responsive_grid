<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- in mobile set initial zoom level of page to 100%, set site size to equal device size-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link href="css/grid.css" rel="stylesheet" type="text/css" />
    <link href="css/main.css" rel="stylesheet" type="text/css" />
    <title>Zima Products Page</title>
  </head>
  <body>
    <header class="grid-con center-grid-con">
      <div id="header-logo" class="box m-col-start-6 m-col-end-8 d-hidden">
        <p>Logo</p>
      </div>
      <nav id="main-nav" class="col-start-2 col-end-4 m-col-start-1 m-col-end-5">
        <ul>
          <li>Home</li>
          <li>Products</li>
        </ul>
      </nav>
      <div id="header-logo-desktop" class="box m-hidden m-col-start-6 m-col-end-8">
        <p>Logo</p>
      </div>
      <div id="nav-button" class="col-start-4 col-end-5 m-col-start-11 m-col-end-13">
        <img src="images/user.svg" alt="user icon" />
      </div>
    </header>
    <main class="grid-con center-grid-con">
      <div id="main-hero" class="box col-span-full m-col-span-full">
        <p>Hero Image</p>
      </div>
      <div id="see-products" class="box col-span-full m-col-span-full">
        <p>see our exclusive products</p>
      </div>
       <div id="product1" class="box col-span-2 m-col-span-4">
        <p>product 1</p>
      </div>
       <div id="product2" class="box col-span-2 m-col-span-4">
        <p>product 2</p>
      </div>
      <div id="product3" class="box col-span-2 m-col-span-4">
        <p>product 3</p>
      </div>
      <div id="product4" class="box col-span-2 m-col-span-4">
        <p>product 4</p>
      </div>

      <div id="product5" class="box col-span-2 m-col-span-4">
        <p>product 5</p>
      </div>

      <div id="product6" class="box col-span-2 m-col-span-4">
        <p>product 6</p>
      </div>
      <div id="see-more" class="box col-start-2 col-end-4 m-col-start-6 m-col-end-8">
        <p>see more...</p>
      </div>
    </main>
    <footer class="grid-con center-grid-con">
        <nav id="footer-nav" class="col-start-1 col-end-4">
        <ul>
          <li>Home</li>
          <li>About</li>
          <li>Contacts</li>
          <li>Products</li>
        </ul>
      </nav>
      <div id="footer-logo" class="box col-start-4 col-end-5 m-col-start-10 m-col-end-13">
        <p>Logo</p>
      </div>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
